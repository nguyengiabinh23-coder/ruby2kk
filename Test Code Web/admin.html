<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operations Center - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #f3f4f6; color: #1f2937; padding: 20px; }

        .container { max-width: 1200px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 20px 30px; border-radius: 16px; border: 1px solid #e5e7eb; margin-bottom: 20px; }
        .header h1 { font-size: 20px; font-weight: 800; color: #111827; }
        .header-actions { display: flex; gap: 10px; }
        .btn-back { background: #4f46e5; color: white; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 700; text-decoration: none; font-size: 13px; cursor: pointer; }

        /* Stats Section */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border-radius: 16px; border: 1px solid #e5e7eb; }
        .stat-label { font-size: 12px; font-weight: 700; color: #6b7280; text-transform: uppercase; margin-bottom: 8px; }
        .stat-value { font-size: 24px; font-weight: 800; color: #111827; }

        /* Section Cards */
        .card { background: white; border-radius: 16px; border: 1px solid #e5e7eb; padding: 20px; margin-bottom: 25px; }
        .card-title { font-size: 16px; font-weight: 800; color: #111827; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }

        /* Form cộng tiền */
        .gift-form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .gift-input { padding: 10px 14px; border-radius: 10px; border: 1px solid #d1d5db; outline: none; flex: 1; min-width: 200px; font-size: 14px; }
        .btn-gift { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-gift:hover { background: #059669; }

        /* Tables */
        .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .data-table th, .data-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #f3f4f6; }
        .data-table th { background: #f9fafb; font-weight: 700; color: #4b5563; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        .data-table tbody tr:hover { background: #fafafa; }

        /* Status Badges & Buttons */
        .badge-pending { background: #fef3c7; color: #d97706; padding: 4px 10px; border-radius: 99px; font-weight: 700; font-size: 12px; display: inline-block; }
        .badge-success { background: #ecfdf5; color: #10b981; padding: 4px 10px; border-radius: 99px; font-weight: 700; font-size: 12px; display: inline-block; }
        
        .btn-status-toggle {
            padding: 5px 12px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; border: none; transition: 0.2s;
        }
        .btn-status-toggle.to-done { background: #10b981; color: white; }
        .btn-status-toggle.to-done:hover { background: #059669; }
        .btn-status-toggle.to-pending { background: #f59e0b; color: white; }
        .btn-status-toggle.to-pending:hover { background: #d97706; }

        .empty-text { text-align: center; color: #9ca3af; padding: 30px 0; font-weight: 500; }
        .btn-clear { background: #ef4444; color: white; border: none; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <span style="font-size: 12px; font-weight: 700; color: #6b7280; text-transform: uppercase;">Operations Center - Management</span>
                <h1>Tổng quan vận hành & Quản lý</h1>
            </div>
            <div class="header-actions">
                <a href="shop.html" class="btn-back">Xem Cửa Hàng</a>
                <button class="btn-clear" onclick="clearAllOrders()">Xóa lịch sử đơn</button>
            </div>
        </div>

        <!-- Khối Tặng / Cộng tiền Member -->
        <div class="card">
            <div class="card-title">🎁 Tặng / Cộng tiền cho Member</div>
            <div class="gift-form">
                <input type="text" id="targetUser" class="gift-input" placeholder="Nhập Username member...">
                <input type="number" id="addAmount" class="gift-input" placeholder="Nhập số tiền (VD: 50000)...">
                <button onclick="giveMoneyToUser()" class="btn-gift">➕ Cộng tiền</button>
            </div>
        </div>

        <!-- Thống kê -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Tổng thành viên</div>
                <div class="stat-value" id="statUsersCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Vật phẩm bán ra</div>
                <div class="stat-value" id="statOrdersCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Doanh thu</div>
                <div class="stat-value" id="statTotalRevenue" style="color: #10b981;">0 đ</div>
            </div>
        </div>

        <!-- Bảng Đơn Hàng Mua Vật Phẩm -->
        <div class="card">
            <div class="card-title">
                <span>🛒 STORE ACTIVITY - Vật phẩm Member vừa mua</span>
                <span style="font-size: 12px; color: #10b981; font-weight: 600;">● Tự động cập nhật</span>
            </div>
            <div style="overflow-x: auto;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Mã đơn</th>
                            <th>Khách hàng</th>
                            <th>Vật phẩm / Gói</th>
                            <th>Giá tiền</th>
                            <th>Thời gian</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <!-- Dữ liệu đơn hàng sẽ render ở đây -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function loadAdminData() {
            // 1. Đọc dữ liệu từ localStorage
            const orders = JSON.parse(localStorage.getItem('app_orders')) || [];
            const usersObj = JSON.parse(localStorage.getItem('app_users_list')) || {};
            const usersCount = Object.keys(usersObj).length || 1;

            // 2. Cập nhật các chỉ số Thống kê
            document.getElementById('statUsersCount').textContent = usersCount;
            document.getElementById('statOrdersCount').textContent = orders.length;

            let totalRev = 0;
            orders.forEach(o => totalRev += Number(o.price || o.amount || 0));
            document.getElementById('statTotalRevenue').textContent = totalRev.toLocaleString('vi-VN') + ' đ';

            // 3. Render danh sách Đơn hàng
            const tbody = document.getElementById('ordersTableBody');
            
            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="empty-text">Chưa có đơn mua vật phẩm.</td></tr>`;
                return;
            }

            // Đảo ngược để đơn hàng mới nhất hiện lên trên đầu
            const sortedOrders = [...orders].reverse();

            tbody.innerHTML = sortedOrders.map(ord => {
                const orderId = ord.id || 'ORD-' + Math.floor(1000 + Math.random() * 9000);
                const customer = ord.username || ord.user || ord.customer || 'Thành viên';
                const itemName = ord.item || ord.productName || 'Vật phẩm';
                const priceFormatted = Number(ord.price || ord.amount || 0).toLocaleString('vi-VN') + ' đ';
                const time = ord.date || ord.time || 'Vừa xong';
                
                // Mặc định trạng thái nếu chưa có là "Đang xử lý"
                const currentStatus = ord.status || 'Đang xử lý';
                const isDone = (currentStatus === 'Đã xong' || currentStatus === 'Thành công');

                const statusBadge = isDone 
                    ? `<span class="badge-success">✔ Đã xong</span>` 
                    : `<span class="badge-pending">⏳ Đang xử lý</span>`;

                const actionButton = isDone
                    ? `<button class="btn-status-toggle to-pending" onclick="toggleOrderStatus('${orderId}')">↩ Đổi thành Đang xử lý</button>`
                    : `<button class="btn-status-toggle to-done" onclick="toggleOrderStatus('${orderId}')">✔ Đánh dấu Đã xong</button>`;

                return `
                    <tr>
                        <td style="font-weight: 700; color: #4f46e5;">#${orderId}</td>
                        <td style="font-weight: 600; color: #111827;">${customer}</td>
                        <td style="font-weight: 600;">${itemName}</td>
                        <td style="color: #10b981; font-weight: 700;">${priceFormatted}</td>
                        <td style="color: #6b7280; font-size: 13px;">${time}</td>
                        <td>${statusBadge}</td>
                        <td>${actionButton}</td>
                    </tr>
                `;
            }).join('');
        }

        // Hàm Tặng / Cộng tiền cho Member
        function giveMoneyToUser() {
            const username = document.getElementById('targetUser').value.trim();
            const amount = parseInt(document.getElementById('addAmount').value);

            if (!username || isNaN(amount) || amount <= 0) {
                alert('Vui lòng nhập đầy đủ Username và số tiền hợp lệ!');
                return;
            }

            // 1. Cập nhật danh sách user chung (app_users_list)
            let usersObj = JSON.parse(localStorage.getItem('app_users_list')) || {};
            if (!usersObj[username]) {
                usersObj[username] = { balance: 0 };
            }
            usersObj[username].balance = (Number(usersObj[username].balance) || 0) + amount;
            localStorage.setItem('app_users_list', JSON.stringify(usersObj));

            // 2. Cập nhật danh sách user đăng ký (registered_users)
            let userList = JSON.parse(localStorage.getItem('registered_users')) || [];
            let found = false;
            userList = userList.map(u => {
                if (u.username && u.username.toLowerCase() === username.toLowerCase()) {
                    u.balance = (Number(u.balance) || 0) + amount;
                    found = true;
                }
                return u;
            });

            if (!found) {
                userList.push({ username: username, balance: amount });
            }
            localStorage.setItem('registered_users', JSON.stringify(userList));

            // 3. Nếu cộng tiền cho chính tài khoản đang đăng nhập hiện tại -> cập nhật ví ngay
            const currentUser = localStorage.getItem('user_username');
            if (currentUser && currentUser.toLowerCase() === username.toLowerCase()) {
                let currentBalance = Number(localStorage.getItem('user_balance')) || 0;
                localStorage.setItem('user_balance', (currentBalance + amount).toString());
            }

            alert(`🎉 Đã cộng thành công ${amount.toLocaleString('vi-VN')} đ cho tài khoản "${username}"!`);
            document.getElementById('targetUser').value = '';
            document.getElementById('addAmount').value = '';
            loadAdminData();
        }

        // Hàm chuyển đổi trạng thái giữa "Đang xử lý" <-> "Đã xong"
        function toggleOrderStatus(orderId) {
            let orders = JSON.parse(localStorage.getItem('app_orders')) || [];
            
            orders = orders.map(ord => {
                if (ord.id === orderId) {
                    const isDone = (ord.status === 'Đã xong' || ord.status === 'Thành công');
                    ord.status = isDone ? 'Đang xử lý' : 'Đã xong';
                }
                return ord;
            });

            // Lưu lại vào localStorage
            localStorage.setItem('app_orders', JSON.stringify(orders));
            localStorage.setItem('app_recent_purchases', JSON.stringify(orders));

            // Tải lại bảng
            loadAdminData();
        }

        function clearAllOrders() {
            if (confirm('Bạn có chắc muốn xóa sạch lịch sử đơn hàng không?')) {
                localStorage.removeItem('app_orders');
                localStorage.removeItem('app_recent_purchases');
                loadAdminData();
            }
        }

        // Tự động load dữ liệu khi vào trang
        document.addEventListener('DOMContentLoaded', loadAdminData);

        // Tự động làm mới khi có đơn hàng mới từ tab Shop
        window.addEventListener('storage', (e) => {
            if (e.key === 'app_orders') {
                loadAdminData();
            }
        });
    </script>
</body>
</html>
