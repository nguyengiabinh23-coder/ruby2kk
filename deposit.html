<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nạp tiền bằng thẻ cào</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        /* Màu nền trang web (Đen tím thẫm) */
        body { 
            background-color: #0d0f1a; 
            color: #f1f5f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }

        /* Thẻ nạp tiền (Khung xanh đen / tím đen nổi bật) */
        .deposit-card { 
            background: #131728; 
            padding: 40px; 
            border-radius: 24px; 
            border: 1px solid #1e2640; 
            width: 450px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); 
            text-align: center; 
        }

        .title { font-size: 24px; font-weight: 800; margin-bottom: 8px; color: #ffffff; }
        .subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 24px; }
        
        .form-group { text-align: left; margin-bottom: 18px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #cbd5e1; }
        
        /* Input & Select màu tối chuẩn tông web */
        .form-group select, .form-group input { 
            width: 100%; 
            padding: 12px 16px; 
            border-radius: 10px; 
            border: 1px solid #232d4b; 
            background-color: #0b0e17; 
            color: #ffffff; 
            font-size: 15px; 
            font-weight: 600; 
            outline: none; 
            transition: all 0.2s;
        }

        .form-group select:focus, .form-group input:focus {
            border-color: #0084ff;
            box-shadow: 0 0 0 2px rgba(0, 132, 255, 0.2);
        }

        .btn-submit { 
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 15px; 
            cursor: pointer; 
            border: none; 
            background: #0084ff; 
            color: white; 
            margin-bottom: 15px; 
            transition: background 0.2s;
        }
        .btn-submit:hover { background: #0066cc; }

        .back-link { display: inline-block; color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
        .back-link:hover { color: #ffffff; }

        .test-codes { margin-top: 20px; padding-top: 15px; border-top: 1px dashed #232d4b; text-align: left; font-size: 12px; color: #94a3b8; }
        .test-codes code { background: #1b2138; padding: 2px 6px; border-radius: 4px; color: #ff5c5c; font-weight: 600; }
    </style>
</head>
<body>

    <div class="deposit-card">
        <h1 class="title">Nạp Tiền Thẻ Cào</h1>
        <p class="subtitle">Vui lòng nhập chính xác thông tin thẻ cào của bạn</p>
        
        <div class="form-group">
            <label for="cardType">Loại thẻ</label>
            <select id="cardType">
                <option value="Viettel">Viettel</option>
                <option value="Mobifone">Mobifone</option>
                <option value="Vinaphone">Vinaphone</option>
                <option value="Zing">Thẻ Zing</option>
            </select>
        </div>

        <div class="form-group">
            <label for="amount">Mệnh giá thẻ</label>
            <select id="amount">
                <option value="10000">10.000 đ</option>
                <option value="20000">20.000 đ</option>
                <option value="50000">50.000 đ</option>
                <option value="100000">100.000 đ</option>
                <option value="200000">200.000 đ</option>
                <option value="500000">500.000 đ</option>
            </select>
        </div>

        <div class="form-group">
            <label for="serial">Số Serial</label>
            <input type="text" id="serial" placeholder="Nhập mã serial trên thẻ..." autocomplete="off">
        </div>

        <div class="form-group">
            <label for="pin">Mã thẻ (Mã sau lớp cào)</label>
            <input type="text" id="pin" placeholder="Nhập mã cào ẩn..." autocomplete="off">
        </div>

        <button class="btn-submit" onclick="handleDeposit()">Xác nhận nạp thẻ</button>
        <a href="shop.html" class="back-link">← Quay lại cửa hàng</a>

        <div class="test-codes">
            <p style="font-weight: 700; margin-bottom: 5px;">Mã test nhanh:</p>
            <p>• Thẻ 20k: <code>SER20K</code> / <code>PIN20K</code></p>
            <p>• Thẻ 100k: <code>SER100K</code> / <code>PIN100K</code></p>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('user_username')) {
            alert('Bạn cần đăng nhập trước!');
            window.location.href = 'shop.html';
        }

        const VALID_CARDS = [
            { serial: "SER20K", pin: "PIN20K", amount: 20000 },
            { serial: "SER100K", pin: "PIN100K", amount: 100000 }
        ];

        function handleDeposit() {
            const username = localStorage.getItem('user_username');
            const cardType = document.getElementById('cardType').value;
            const selectedAmount = parseInt(document.getElementById('amount').value);
            const inputSerial = document.getElementById('serial').value.trim();
            const inputPin = document.getElementById('pin').value.trim();

            if (!inputSerial || !inputPin) {
                alert('Vui lòng nhập đầy đủ thông tin!');
                return;
            }

            let currentHistory = JSON.parse(localStorage.getItem('admin_deposit_history')) || [];

            const foundCard = VALID_CARDS.find(card => 
                card.serial === inputSerial && card.pin === inputPin && card.amount === selectedAmount
            );

            let newLog = {
                time: new Date().toLocaleString('vi-VN'),
                user: username,
                type: cardType,
                amount: selectedAmount,
                serial: inputSerial,
                pin: inputPin,
                status: foundCard ? "Thành công" : "Sai thẻ / Lỗi"
            };

            currentHistory.push(newLog);
            localStorage.setItem('admin_deposit_history', JSON.stringify(currentHistory));

            if (!foundCard) {
                alert('Mã thẻ hoặc Serial không chính xác!');
                return;
            }

            let currentBalance = parseInt(localStorage.getItem('user_balance')) || 0;
            localStorage.setItem('user_balance', (currentBalance + selectedAmount).toString());

            alert('Nạp thẻ thành công!');
            window.location.href = 'shop.html';
        }
    </script>
</body>
</html>
